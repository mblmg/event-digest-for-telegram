name: Release

# Push a tag like 1.0.1 to publish a release. Installed copies of the plugin
# find the new version through the GitHub API and offer it as an update.

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SLUG: event-digest-for-telegram
    steps:
      - uses: actions/checkout@v5

      - name: Check version numbers match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -Eq "^ \* Version:\s+${TAG}$" "${SLUG}.php" || { echo "Plugin header version does not match ${TAG}"; exit 1; }
          grep -q "define('IMM_TG_VERSION', '${TAG}');" "${SLUG}.php" || { echo "IMM_TG_VERSION does not match ${TAG}"; exit 1; }
          grep -Eq "^Stable tag: ${TAG}$" readme.txt || { echo "Stable tag does not match ${TAG}"; exit 1; }

      - name: Build zip
        run: |
          mkdir -p "build/${SLUG}"
          rsync -a --exclude-from=.distignore --exclude=build ./ "build/${SLUG}/"
          (cd build && zip -qr "../${SLUG}.zip" "${SLUG}")

      - name: Publish GitHub release with the zip
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SLUG }}.zip
          generate_release_notes: true
