name: Plugin Check

# Runs the official WordPress.org Plugin Check on every push and pull request.
#
# - The updater check is skipped: this plugin updates itself from GitHub releases
#   on purpose, because it is not distributed through WordPress.org.
# - Plugin Check installs required plugins from WordPress.org. "Add to Calendar from
#   Custom Fields" is not there yet, so the "Requires Plugins" line is removed from
#   the copy that gets checked. The released plugin keeps it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build plugin folder
        run: |
          mkdir -p build/event-digest-for-telegram
          rsync -a --exclude-from=.distignore --exclude=build ./ build/event-digest-for-telegram/
          sed -i '/^ \* Requires Plugins:/d' build/event-digest-for-telegram/event-digest-for-telegram.php

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/event-digest-for-telegram
          exclude-checks: |
            plugin_updater
